<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Croisière aux Caraïbes</title>
  <style>
    html, body {
      min-height: 100%;
      margin: 0;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
      box-sizing: border-box;
      background: #111;
      color: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    h1 {
      margin: 0 0 16px;
      font-size: clamp(1.4rem, 4vw, 2.2rem);
    }
    figure {
      margin: 0;
    }
    img {
      /* S'adapte à l'écran sans déformation ni agrandissement flou */
      max-width: 100%;
      max-height: 75vh;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
      margin: 0 auto;
    }
    figcaption {
      margin-top: 12px;
      font-size: clamp(1rem, 2.5vw, 1.2rem);
      color: #ccc;
    }
  </style>
</head>
<body>
  <h1>Croisière aux Caraïbes</h1>
  <figure>
    <img
      src="MSC_World_Europa_-_Saint-Nazaire_-_June_2022.jpg"
      alt="Le paquebot MSC World Europa au large de Saint-Nazaire, juin 2022"
      decoding="async">
    <figcaption>Navire MSC World Europa</figcaption>
  </figure>
</body>
</html>
